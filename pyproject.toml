[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepmushra-data"
version = "0.4.0"
description = "Reproducible, metadata-grounded synthetic audio degradations"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.14,<2",
  "soundfile>=0.12,<1",
  "PyYAML>=6,<7",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
deepmushra-data = "deepmushra_mapped.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
deepmushra_mapped = ["mapping_table.json", "profile.json", "profile-v2.json", "training_contract.json"]
